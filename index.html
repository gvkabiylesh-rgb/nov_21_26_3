<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heart | A little gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Lora:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140d1f;--plum:#3d2050;--pink:#ff3d8b;--pink2:#d41f70;--ink:#fff;--soft:#e7d3f2;--card:#27132f;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
background:radial-gradient(70% 55% at 50% 62%,var(--plum),transparent 70%),var(--bg)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;transition:opacity .8s,transform .8s}
#stage.out{opacity:0;transform:scale(1.08);pointer-events:none}
#heart{position:relative;width:min(78vw,340px);padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
#heart:focus-visible{outline:3px solid #fff;outline-offset:10px;border-radius:30px}
.ring{position:absolute;left:50%;bottom:34%;width:150%;aspect-ratio:.82;transform:translateX(-50%);border:1.5px solid rgba(255,255,255,.28);border-radius:50%;pointer-events:none}
.ring.r2{width:96%;border-color:rgba(255,255,255,.4)}
.ripple{position:absolute;left:50%;bottom:34%;width:60%;aspect-ratio:.82;border:2px solid rgba(255,160,210,.8);border-radius:50%;pointer-events:none;animation:rip .9s ease-out forwards}
@keyframes rip{from{transform:translateX(-50%) scale(.7);opacity:.9}to{transform:translateX(-50%) scale(1.9);opacity:0}}
.mini{position:absolute;bottom:45%;font-size:14px;color:#ffb3d6;pointer-events:none;animation:up 2.2s ease-out forwards}
@keyframes up{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-190px) scale(1.1);opacity:0}}
svg{display:block;width:100%;height:auto;overflow:visible;position:relative}
#liq{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.wave{animation:wv 2.4s linear infinite}
@keyframes wv{to{transform:translateX(-100px)}}
h1{position:relative;margin:-34px 0 0;font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(20,5,30,.7);text-align:center}
.sub,.count{position:relative;margin:10px 0 0;font-weight:800;font-size:15px;text-align:center;text-shadow:0 1px 8px rgba(20,5,30,.8);color:var(--soft)}
.count{font-size:13px;margin-top:12px}
.bar{width:min(78vw,340px);height:10px;margin-top:18px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
#bf{height:100%;width:0;background:linear-gradient(90deg,#b0307c,var(--pink));transition:width .4s}
#letter{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));opacity:0;transition:opacity 1s}
#letter[hidden]{display:none}
#letter.in{opacity:1}
.card{width:min(100%,460px);max-height:100%;display:flex;flex-direction:column;background:var(--card);border:1px solid rgba(255,150,200,.25);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.scroll{overflow-y:auto;padding:18px 18px 22px;-webkit-overflow-scrolling:touch}
.kicker{margin:0;color:#ff8ec0;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.to{margin:4px 0 14px;font-size:17px;font-weight:600;color:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tile{aspect-ratio:4/5;border:1px dashed rgba(255,170,215,.4);border-radius:8px;background:rgba(255,255,255,.06) center/cover no-repeat;color:#ffb3d6;font:700 13px 'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px}
.tile.has{border-style:solid;border-color:transparent;color:transparent}
.tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
.text{font-family:'Lora',Georgia,'Times New Roman',serif;font-weight:700;font-size:19px;line-height:1.65}
.text p{margin:0 0 12px}
.line{height:3px;background:rgba(255,255,255,.08)}
.hello{position:relative;z-index:2;max-width:90vw;margin:0 0 22px;text-align:center;font-weight:800;font-size:clamp(21px,6.4vw,28px);line-height:1.3;color:#ffd3e8;text-shadow:0 2px 14px rgba(20,5,30,.8)}
#mute{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,170,215,.4);background:rgba(39,19,47,.75);color:#fff;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#mute:focus-visible{outline:3px solid #fff;outline-offset:2px}
#lf{height:100%;width:0;background:var(--pink)}
@media (prefers-reduced-motion:reduce){.wave{animation:none}.mini,.ripple{animation-duration:.01s}#letter,#stage{transition:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="mute" type="button" aria-label="Play music" title="Music">🎵</button>

<main id="stage">
  <p class="hello">Happy 8 months anniversary, Vave 💗😚</p>
  <button id="heart" type="button" aria-label="Tap the heart to fill it">
    <span class="ring"></span><span class="ring r2"></span>
    <svg viewBox="-12 -12 224 204" aria-hidden="true">
      <defs>
        <clipPath id="hc"><path d="M100 175C30 120 0 85 0 50C0 22 22 2 50 2C72 2 90 14 100 34C110 14 128 2 150 2C178 2 200 22 200 50C200 85 170 120 100 175Z"/></clipPath>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7fb8"/><stop offset="1" stop-color="#d41f70"/></linearGradient>
      </defs>
      <g fill="rgba(210,130,220,.14)">
        <path transform="translate(100 90) scale(1.2) translate(-100 -90)" d="M100 175C30 120 0 85 0 50C0 22 22 2 50 2C72 2 90 14 100 34C110 14 128 2 150 2C178 2 200 22 200 50C200 85 170 120 100 175Z"/>
        <path transform="translate(100 90) scale(1.1) translate(-100 -90)" d="M100 175C30 120 0 85 0 50C0 22 22 2 50 2C72 2 90 14 100 34C110 14 128 2 150 2C178 2 200 22 200 50C200 85 170 120 100 175Z"/>
      </g>
      <path fill="rgba(255,255,255,.07)" d="M100 175C30 120 0 85 0 50C0 22 22 2 50 2C72 2 90 14 100 34C110 14 128 2 150 2C178 2 200 22 200 50C200 85 170 120 100 175Z"/>
      <g clip-path="url(#hc)"><g id="liq" style="transform:translateY(190px)"><g class="wave"><path fill="url(#lg)" d="M-200 0q25-9 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V220H-200Z"/></g></g></g>
      <path fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" d="M100 175C30 120 0 85 0 50C0 22 22 2 50 2C72 2 90 14 100 34C110 14 128 2 150 2C178 2 200 22 200 50C200 85 170 120 100 175Z"/>
      <g stroke="#fff" stroke-width="2.5" font-size="17" text-anchor="middle">
        <circle cx="76" cy="84" r="19" fill="#f3d6e6"/><circle cx="100" cy="84" r="19" fill="#e9d9f5"/><circle cx="124" cy="84" r="19" fill="#d8ecf2"/>
        <g stroke="none"><text x="76" y="90">❤️</text><text x="100" y="90">❤️</text><text x="124" y="90">❤️</text></g>
      </g>
    </svg>
  </button>
  <h1 id="title">Press me</h1>
  <p class="sub">Keep tapping – the heart fills up.</p>
  <p class="count" id="count">6 photos inside. Tap to see</p>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div id="bf"></div></div>
</main>

<section id="letter" hidden aria-label="Your letter">
  <div class="card">
    <div class="scroll" id="sc">
      <p class="kicker" id="kick">A little letter</p>
      <p class="to" id="to"></p>
      <div class="grid" id="grid"></div>
      <div class="text" id="txt"></div>
    </div>
    <div class="line"><div id="lf"></div></div>
  </div>
</section>
<input type="file" id="pick" accept="image/*" hidden>

<script>
// ---- Edit these ----
var CONFIG = {
  taps: 14,
  photos: ['p1.jpg','p2.jpg','p3.jpg','p4.jpg','p5.jpg','p6.jpg'], // up to 6 file names, e.g. ['p1.jpg','p2.jpg','p3.jpg','p4.jpg','p5.jpg','p6.jpg']
  song: 'song.mp3', // put your file name here, e.g. 'song.mp3' (keep it in the same folder as this file)
  to: 'To ente vave',
  letter: [
    'Happy 8 months annivesary to us vave 💗',
    'Damn, we time is going like a bullet train. Damn, we are nearing a year uh. Ur the best thing uh that ever happened to me uh💗',
    'Thanks for coming into my life vave💗. Vave actually uh I wrote letter uh in one thing uh after reading this uh I’ll show u uh. After reading that uh u will get irritated😂😂',
    'Luv u sooooooooooooooo sooooooooooooo sooooooooooo muchhhhhh vaveeeeeee 💗😚💋'
  ]
};
// --------------------
var $ = function (id) { return document.getElementById(id); };
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var heart = $('heart'), liq = $('liq'), title = $('title'), bf = $('bf'), pb = $('pb');
var n = 0, done = false;

function label(l) {
  if (l <= 0) return 'Press me';
  if (l < .6) return 'Keep going…';
  if (l < .85) return 'Almost full!';
  return 'Nearly there!';
}

function tap() {
  if (done) return;
  n++;
  var l = Math.min(n / CONFIG.taps, 1);
  liq.style.transform = 'translateY(' + (190 - l * 205) + 'px)';
  bf.style.width = (l * 100) + '%';
  pb.setAttribute('aria-valuenow', Math.round(l * 100));
  title.textContent = label(l);
  if (!reduce) heart.animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}], {duration: 220});
  var r = document.createElement('span'); r.className = 'ripple'; heart.appendChild(r);
  setTimeout(function () { r.remove(); }, 950);
  for (var i = 0; i < 3; i++) {
    var m = document.createElement('span'); m.className = 'mini'; m.textContent = '♥';
    m.style.left = (30 + Math.random() * 40) + '%'; m.style.animationDelay = (i * .12) + 's';
    heart.appendChild(m); setTimeout(function (e) { e.remove(); }, 2500, m);
  }
  if (n >= CONFIG.taps) finish();
}
// ---- Music: soft looping melody made in the browser (starts on first tap) ----
var A = null, AC = null, master = null, muted = false, step = 0, nextT = 0, mb = $('mute');
var CH = [[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]];
var ARP = [0,1,2,1,2,1,2,1], VOL = .35;
function note(f, t, d, type, v, atk) {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + atk);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .05);
}
function sched() {
  while (nextT < AC.currentTime + .35) {
    var c = CH[Math.floor(step / 8) % 4], i = step % 8;
    if (i === 0) { note(c[0] / 2, nextT, 2.9, 'sine', .5, .02); c.forEach(function (f) { note(f, nextT, 3.2, 'triangle', .07, .5); }); }
    note(c[ARP[i]] * 2, nextT, .9, 'triangle', .2, .01);
    if (i === 4) note(c[2] * 4, nextT, 1.2, 'sine', .07, .01);
    step++; nextT += .4;
  }
}
function startMusic() {
  if (AC || A) return;
  if (CONFIG.song) {
    A = new Audio(CONFIG.song); A.loop = true; A.volume = .8; A.play().catch(function () {});
    mb.textContent = '🔊'; mb.setAttribute('aria-label', 'Mute music'); return;
  }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
    master.gain.linearRampToValueAtTime(VOL, AC.currentTime + 2);
    nextT = AC.currentTime + .1; setInterval(sched, 100);
    mb.textContent = '🔊'; mb.setAttribute('aria-label', 'Mute music');
  } catch (e) { AC = null; }
}
mb.addEventListener('click', function () {
  if (!AC && !A) { startMusic(); return; }
  muted = !muted;
  if (A) A.muted = muted; else master.gain.setTargetAtTime(muted ? 0 : VOL, AC.currentTime, .15);
  mb.textContent = muted ? '🔇' : '🔊'; mb.setAttribute('aria-label', muted ? 'Unmute music' : 'Mute music');
});
document.addEventListener('visibilitychange', function () {
  if (A) { if (document.hidden) A.pause(); else A.play().catch(function () {}); return; }
  if (!AC) return;
  if (document.hidden) AC.suspend(); else if (!muted) AC.resume();
});
heart.addEventListener('click', function () { startMusic(); tap(); });

// ---- Canvas: confetti + falling hearts ----
var cv = $('fx'), cx = cv.getContext('2d'), P = [], raining = false, running = false, dpr = Math.min(devicePixelRatio || 1, 2);
var HP = new Path2D('M0 .9C-.9 .2-1 -.5-.5 -.8C-.2 -1 0 -.7 0 -.5C0 -.7 .2 -1 .5 -.8C1 -.5 .9 .2 0 .9Z');
function size() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
size(); addEventListener('resize', size);
var COL = ['#ff3d8b', '#ffd23f', '#3fd0ff', '#8cff6b', '#c58bff', '#ffffff'];

function burst() {
  var b = heart.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height * .45, c = reduce ? 30 : 140;
  for (var i = 0; i < c; i++) {
    var a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 11;
    P.push({k: 'c', x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, col: COL[(Math.random() * COL.length) | 0], g: .22, life: 130 + Math.random() * 60});
  }
}
function drop() {
  var s = 10 + Math.random() * 26;
  P.push({k: 'h', x: Math.random() * innerWidth, y: -40, vx: (Math.random() - .5) * .6, vy: .8 + Math.random() * 1.8, w: s, rot: (Math.random() - .5) * .6,
    vr: (Math.random() - .5) * .02, col: Math.random() < .5 ? '#ff3d8b' : '#c92a78', a: .35 + Math.random() * .4, g: 0, life: 9999});
}
function frame() {
  cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, innerWidth, innerHeight);
  if (raining && Math.random() < (reduce ? .03 : .25)) drop();
  for (var i = P.length - 1; i >= 0; i--) {
    var p = P[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= p.k === 'c' ? .985 : 1; p.rot += p.vr; p.life--;
    if (p.life <= 0 || p.y > innerHeight + 50) { P.splice(i, 1); continue; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.col;
    if (p.k === 'c') { cx.globalAlpha = Math.min(1, p.life / 40); cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
    else { cx.globalAlpha = p.a; cx.scale(p.w, p.w); cx.fill(HP); }
    cx.restore();
  }
  if (P.length || raining) requestAnimationFrame(frame); else running = false;
}
function go() { if (!running) { running = true; requestAnimationFrame(frame); } }

// ---- Reveal ----
function finish() {
  done = true; title.textContent = 'Full of love!';
  if (!reduce) heart.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}], {duration: 600, easing: 'ease-out'});
  burst(); go();
  setTimeout(function () { $('stage').classList.add('out'); raining = true; go(); }, 1100);
  setTimeout(function () { var L = $('letter'); L.hidden = false; requestAnimationFrame(function () { L.classList.add('in'); }); }, 2200);
}

// ---- Letter content ----
$('to').textContent = CONFIG.to;
$('txt').innerHTML = CONFIG.letter.map(function (t) { return '<p></p>'; }).join('');
Array.prototype.forEach.call($('txt').children, function (p, i) { p.textContent = CONFIG.letter[i]; });
var cur = null, pick = $('pick');
for (var i = 1; i <= 6; i++) {
  var t = document.createElement('button'); t.type = 'button'; t.className = 'tile';
  t.textContent = 'Add photo ' + i; t.setAttribute('aria-label', 'Add photo ' + i);
  var src = CONFIG.photos[i - 1];
  if (src) { t.style.backgroundImage = 'url("' + src + '")'; t.classList.add('has'); t.textContent = ''; }
  t.addEventListener('click', function (e) { cur = e.currentTarget; pick.click(); });
  $('grid').appendChild(t);
}
pick.addEventListener('change', function () {
  var f = pick.files && pick.files[0];
  if (f && cur) { cur.style.backgroundImage = 'url(' + URL.createObjectURL(f) + ')'; cur.classList.add('has'); cur.textContent = ''; }
  pick.value = '';
});
var sc = $('sc');
sc.addEventListener('scroll', function () {
  var m = sc.scrollHeight - sc.clientHeight;
  $('lf').style.width = (m > 0 ? sc.scrollTop / m * 100 : 100) + '%';
});
</script>
</body>
</html>
